# Deploy do Convidai para o Dokku em 177.93.132.42 (app `convidai`,
# domínio convites.celebre.digital).
#
# Secrets necessários no repositório:
#   DOKKU_SSH_KEY  — chave PRIVADA ed25519 cuja pública está em `dokku ssh-keys:add`
#   DOKKU_HOST     — 177.93.132.42
#
# Segredos da aplicação (AUTH_SECRET, credenciais do Google) NÃO passam por aqui:
# vivem em `dokku config` no servidor e nunca tocam o CI.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -- svelte-check --tsconfig ./tsconfig.json
      - run: npm run build

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dois deploys simultâneos brigariam pelo mesmo receive do Dokku. Nunca
    # cancelar no meio: um push interrompido deixa o app num release parcial.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # O Dokku recebe um `git push`, e não se faz push de um clone raso.
          fetch-depth: 0

      - name: Preparar chave SSH
        env:
          DOKKU_SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DOKKU_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DOKKU_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publicar no Dokku
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
        run: |
          set -euo pipefail
          git push --force "dokku@${DOKKU_HOST}:convidai" "HEAD:refs/heads/main"

      - name: Conferir que o domínio respondeu
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 10); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://convites.celebre.digital/ || echo 000)
            if [ "$codigo" = "200" ]; then
              echo "convites.celebre.digital respondeu 200 na tentativa $tentativa"
              exit 0
            fi
            echo "tentativa $tentativa: HTTP $codigo"
            sleep 5
          done
          echo "::error::O domínio não respondeu 200 depois do deploy"
          exit 1
